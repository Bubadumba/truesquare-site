# Scores and SERP notes come from a one-day index observation on 2026-10-23 (no Google PAA capture, no search volumes).
# The agent fills slug and drafted_on when it writes a post. Flip a status to approved to put a topic in the queue.

- id: seattle-bathroom-permit
  title: "Do you need a permit for a bathroom remodel in Seattle? Rules and 2026 fees"
  target_query: "do I need a permit to remodel a bathroom in Seattle"
  variants: ["bathroom remodel permit seattle", "seattle bathroom permit cost", "STFI permit bathroom"]
  intent: permit-explainer
  hub: permits
  angle: "SDCI $6,000 per 6 months rule, STFI path (40% plan review, $292 base, 5% tech fee, DFI table), plumbing permit from King County Public Health ($132 + $26 per fixture), electrical from SDCI, $500/day fines; competitors cite 2017 fees and the old agency name."
  owner_inputs: ["which permits our Seattle jobs pulled (no fee invention)", "photo of a posted permit card if any"]
  page_type: blog-pillar
  priority: 1
  status: approved
  requires_project_city: null
  notes: "SERP: CRD 2017 post, permitmint (inconsistent), Block, Board & Vellum. Official SDCI pages do not surface. Realistic: yes."

