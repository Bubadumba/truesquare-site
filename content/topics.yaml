# content/topics.yaml
# Topic queue for the TrueSquare Remodel blog. The agent writes ONLY entries with status: approved.
# status: proposed | approved | blocked | drafted | published | merged-into:<slug> | rejected
# intent: cost-guide | comparison | how-to | permit-explainer | project-story | seasonal | faq | trust
